<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando CSS interno na página</title>
    <!-- CSS sempre fica no Head da página-->

    <style>
        /*Adicionando CSS a TAG p */
        p {
            color: red;
            font-size: 23px;
        }
        h1 {
            background-color: blue;
        }
        s {
            font-size: 25px;
        }
    </style>
</head>
<body>
    <p>CSS interno da página</p>
    <p>Teste</p>
    <h1>Não sei</h1>
    <s>Qualquer coisa</s>
</body>
</html>
